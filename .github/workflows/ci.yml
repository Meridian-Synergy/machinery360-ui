name: CI

on:
  pull_request:
    branches: [main]
    # Docs-only PRs don't need a build — this is the cheapest minute saved.
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: @nuxt/eslint (via eslint-flat-config-utils) uses
          # Object.groupBy, which needs Node 21+. On Node 20 the lint fails in CI
          # while passing locally — invisible until it blocks a PR.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Storybook
        run: pnpm build-storybook
