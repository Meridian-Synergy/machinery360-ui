<!--
  This repo is PUBLIC so Storybook can be published on GitHub Pages for free.
  A robots.txt on a project page is IGNORED (crawlers only read it at the domain
  root), so de-indexing has to happen via meta tags — in BOTH the manager page
  (here) and the preview iframe (preview-head.html).

  This is de-indexing, not protection: the repo stays public and readable by URL.
-->
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
